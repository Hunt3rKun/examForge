name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils mupdf-tools util-linux xz-utils
      - name: Install pinned Typst
        run: |
          curl -fsSLo typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf typst.tar.xz
          sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - name: Install pinned sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Run verification gate
        run: ./scripts/verify.sh
